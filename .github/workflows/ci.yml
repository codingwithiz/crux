name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Pure functions — no browser, no server.
      - name: Unit tests
        run: npx playwright test --project=unit

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # The server is booted by playwright.config with Supabase deliberately
      # unset and MOCK_LLM=1, so this run needs no secrets and spends nothing.
      - name: Browser tests
        run: npx playwright test --project=browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
